<VirtualHost *:80>
    # เปิดให้เข้าถึงเฉพาะ public เพื่อไม่เปิดเผยไฟล์ config และ source
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
